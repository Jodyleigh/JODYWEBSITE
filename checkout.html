<main><h2>Checkout</h2>
<div class="cart-box"><h3>Your Cart</h3><div id="cart-list"></div><div id="cart-total" class="cart-total">Total: R0.00</div></div>
<form id="checkout-form" class="checkout-form">
<label for="name">Full Name</label><input id="name" type="text" placeholder="Full Name" required>
<label for="email">Email</label><input id="email" type="email" placeholder="Email" required>
<label for="address">Delivery Address</label><textarea id="address" placeholder="Delivery Address" required></textarea>
<label for="payment">Payment Method</label><select id="payment" required><option value="">Select payment method</option><option>Cash on Delivery</option><option>Card</option><option>EFT</option></select>
<button class="btn" type="submit">Place Order</button>
</form>
<div style="text-align:center"><button id="clear-cart" class="btn" style="background:#555" type="button">Clear Cart</button></div>
</main>
